<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Palmwise Island – A Climate Adventure</title>
  <meta name="description" content="A climate game for kids aged 8–14: help a monkey make sustainable choices on its island. Made by students at the University of St. Gallen (HSG).">
  <meta name="theme-color" content="#6fcff6">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐒</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="icon-btn" id="homeBtn" data-action="home" hidden>🏠</button>
      <div class="brand" id="brand">🐒 Palmwise Island</div>
      <div class="controls">
        <select class="lang-sel" id="langSel">
          <option value="en">EN</option>
          <option value="de">DE</option>
          <option value="it">IT</option>
          <option value="fr">FR</option>
        </select>
        <button class="icon-btn" id="musicBtn" data-action="music" aria-pressed="true">🎵</button>
        <button class="icon-btn" id="sfxBtn" data-action="sfx" aria-pressed="true">🔊</button>
      </div>
    </header>

    <main id="screen"></main>

    <nav class="tabs" id="tabs" hidden></nav>
  </div>

  <div id="toasts" aria-live="polite"></div>
  <div id="modal" hidden></div>

  <noscript><p style="text-align:center;font-weight:800">Please turn on JavaScript to play Palmwise Island.</p></noscript>

  <script src="js/vendor/qrcode.min.js"></script>
  <script src="js/content.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/filter.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
