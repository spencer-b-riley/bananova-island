<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bobo’s City – A Climate Adventure</title>
  <meta name="description" content="A climate game for kids aged 8–10: help Bobo the monkey make everyday choices and keep the city cool. Made by students at the University of St. Gallen (HSG).">
  <meta name="theme-color" content="#6fcff6">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='6.5' cy='17' r='3.8' fill='%238b5a2b'/%3E%3Ccircle cx='25.5' cy='17' r='3.8' fill='%238b5a2b'/%3E%3Ccircle cx='16' cy='17' r='10' fill='%238b5a2b'/%3E%3Cellipse cx='16' cy='19.2' rx='6.8' ry='5.5' fill='%23e8c39e'/%3E%3Ccircle cx='13' cy='15.5' r='3.2' fill='%23e8c39e'/%3E%3Ccircle cx='19' cy='15.5' r='3.2' fill='%23e8c39e'/%3E%3Ccircle cx='13.2' cy='15.8' r='1.3' fill='%2323313f'/%3E%3Ccircle cx='18.8' cy='15.8' r='1.3' fill='%2323313f'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="icon-btn" id="homeBtn" data-action="home" hidden></button>
      <div class="brand" id="brand">Bobo’s City</div>
      <div class="controls">
        <select class="lang-sel" id="langSel">
          <option value="en">EN</option>
          <option value="de">DE</option>
          <option value="it">IT</option>
          <option value="fr">FR</option>
        </select>
        <button class="icon-btn" id="musicBtn" data-action="music" aria-pressed="true"></button>
        <button class="icon-btn" id="sfxBtn" data-action="sfx" aria-pressed="true"></button>
      </div>
    </header>

    <main id="screen"></main>

    <nav class="tabs" id="tabs" hidden></nav>
  </div>

  <div id="toasts" aria-live="polite"></div>
  <div id="modal" hidden></div>

  <noscript><p style="text-align:center;font-weight:800">Please turn on JavaScript to play Bobo’s City.</p></noscript>

  <script src="js/perf.js"></script>
  <script src="js/vendor/qrcode.min.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/content.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
